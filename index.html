<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kart Oyunu">
<meta name="theme-color" content="#1a1025">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Kart Oyunu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#1a1025;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif}
.ekran{display:none;min-height:100vh;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.ekran.aktif{display:flex}
h1{font-size:2.2rem;margin:0}
h2{margin:0 0 8px}
p{margin:0;opacity:.8}
button{width:100%;max-width:340px;padding:16px;border:0;border-radius:16px;font-size:1.1rem;font-weight:600;color:#fff;background:#7c3aed}
button:active{opacity:.7}
button.ikincil{background:#2d2040}
button.kucuk{padding:10px;font-size:.9rem}
.kart{width:100%;max-width:340px;min-height:200px;padding:28px;border-radius:24px;background:linear-gradient(145deg,#3b2a5c,#2d2040);border:2px solid #7c3aed;display:flex;align-items:center;justify-content:center;font-size:1.3rem;line-height:1.4}
.kart.cevir{animation:cevir .45s ease}
@keyframes cevir{0%{transform:rotateY(90deg);opacity:.2}100%{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.kart.cevir{animation:none}}
.bilgi{font-size:.95rem;opacity:.7}
.turler{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:340px}
.tur{width:auto;max-width:none;padding:10px 2px;font-size:.78rem;background:#2d2040;opacity:.55;display:flex;flex-direction:column;align-items:center;gap:2px}
.tur .ik{font-size:1.35rem;line-height:1.2}
.tur.acik{background:#7c3aed;opacity:1}
.mod{display:flex;align-items:center;text-align:left;gap:12px}
.mod .mik{font-size:1.6rem}
.mod small{display:block;font-weight:400;opacity:.8;font-size:.8rem;margin-top:2px}
.uyari{color:#fbbf24;opacity:1;min-height:1.2em}
.oyuncu{width:100%;max-width:340px;padding:14px;border-radius:16px;background:#241836;border:1px solid #4b3a6e;display:flex;flex-direction:column;gap:10px;text-align:left}
.satir{display:flex;gap:8px;align-items:center}
.oyuncu input,.oyuncu select{width:100%;min-width:0;padding:14px;border-radius:12px;border:1px solid #4b3a6e;background:#2d2040;color:#fff;font-size:16px;font-family:inherit}
.oyuncu input::placeholder{color:#9a8bb5}
.etiket{font-size:.85rem;opacity:.7;margin:2px 0 -4px 2px}
.sil{width:auto;flex:none;padding:12px 14px;background:#3b2a5c;font-size:1rem}
#oyuncuListe,#modListe{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
</style>
</head>
<body>

<div id="menu" class="ekran aktif">
  <h1>💜 Kart Oyunu</h1>
  <p>Kart çek, görevi yap, birlikte eğlen.</p>
  <button onclick="goster('oyuncular')">Oyuna Başla</button>
</div>

<div id="oyuncular" class="ekran">
  <h2>Kimler oynuyor?</h2>
  <div id="oyuncuListe"></div>
  <button id="ekleBtn" class="ikincil" onclick="oyuncuEkle()">＋ Yeni oyuncu ekle</button>
  <p id="oyuncuUyari" class="bilgi uyari"></p>
  <button onclick="oyuncularDevam()">Devam Et</button>
  <button class="ikincil" onclick="goster('menu')">← Geri</button>
</div>

<div id="modlar" class="ekran">
  <h2>Bir mod seç</h2>
  <div id="modListe"></div>
  <button class="ikincil" onclick="goster('oyuncular')">← Oyunculara dön</button>
</div>

<div id="turEkran" class="ekran">
  <h2 id="turBaslik"></h2>
  <p id="turAciklama" class="bilgi"></p>
  <div id="turGrid" class="turler"></div>
  <p class="bilgi">İstemediğin türü kapat. Her kartta Pas Geç de var.</p>
  <button id="hepsiBtn" class="ikincil kucuk" style="display:none" onclick="hepsiniAc()">Hepsini aç</button>
  <p id="uyari" class="bilgi uyari"></p>
  <button id="baslaBtn" onclick="oyunuBaslat()">🎴 Başla</button>
  <button class="ikincil" onclick="goster('modlar')">← Mod seçimine dön</button>
</div>

<div id="oyun" class="ekran">
  <h2 id="modAdi"></h2>
  <div class="bilgi" id="siraBilgi"></div>
  <div class="kart" id="kart">Hazır olunca kart çek 👇</div>
  <div class="bilgi" id="kuralBilgi" style="display:none"></div>
  <div class="bilgi" id="sayac"></div>
  <button id="cekBtn" onclick="kartCek(false)">🎴 Kart Çek</button>
  <button id="pasBtn" class="ikincil" style="display:none" onclick="kartCek(true)">⏭️ Pas Geç</button>
  <button class="ikincil" onclick="turSayfasiAc(mod)">← Türleri değiştir</button>
  <button class="ikincil" onclick="goster('modlar')">Mod değiştir</button>
</div>

<script>
var TUR_LISTESI=[
{k:"sohbet",e:"🗣️",ad:"Sohbet"},
{k:"soru",e:"❓",ad:"Sorular"},
{k:"itiraf",e:"❤️‍🔥",ad:"İtiraf"},
{k:"tahmin",e:"🔮",ad:"Tahmin"},
{k:"hareket",e:"🎭",ad:"Hareket"},
{k:"yaratici",e:"🎨",ad:"Yaratıcı"},
{k:"meydan",e:"⚡",ad:"Meydan"},
{k:"yakin",e:"🤗",ad:"Yakınlık"},
{k:"gunluk",e:"🏠",ad:"Günlük"},
{k:"sosyal",e:"📱",ad:"Sosyal"},
{k:"aile",e:"👪",ad:"Çevre"},
{k:"hayat",e:"🌍",ad:"Hayat"},
{k:"ask",e:"💞",ad:"Aşk"},
{k:"cilgin",e:"🤪",ad:"Çılgın"}
];

var MODLAR=[
{ad:"Romantik",ikon:"💕",aciklama:"Duygusal ve yakın anlar"},
{ad:"Eğlenceli",ikon:"🎉",aciklama:"Oyun ve kahkaha dolu"},
{ad:"Beni Ne Kadar Tanıyorsun",ikon:"🧠",aciklama:"Birbirinizi ne kadar bilirsiniz?"},
{ad:"Uzak Mesafe",ikon:"✈️",aciklama:"Görüntülü konuşarak oynayın"},
{ad:"Evde Gece",ikon:"🏡",aciklama:"Evde yapılacak keyifli şeyler"},
{ad:"Yeni Tanışanlar",ikon:"🌱",aciklama:"Çekinmeden, hafif ve tatlı"},
{ad:"Gelecek",ikon:"✨",aciklama:"Hayaller, planlar, hedefler"},
{ad:"Ok mu Nok mu",ikon:"🚦",aciklama:"Bu durum sizce normal mi?",kural:"Birlikte sayın: 3, 2, 1! Aynı anda 👍 (OK) ya da 👎 (NOK) gösterin, sonra nedenini anlatın.",buton:"➡️ Sonraki Kart"},
{ad:"İkisinden Birini Seç",ikon:"⚖️",aciklama:"Hangisini seçersin?",kural:"İkiniz de gizlice seçin, aynı anda söyleyin ve nedenini anlatın.",buton:"➡️ Sonraki Kart"}
];

/* Kartlar ayrı dosyalarda: kartlar/<mod-adi>.js */
var GOREVLER={};
function ekle(modAd,liste){
  if(!GOREVLER[modAd]){ GOREVLER[modAd]=[]; }
  for(var i=0;i<liste.length;i++){ GOREVLER[modAd].push(liste[i]); }
}
</script>
<script src="kartlar/romantik.js?v=1"></script>
<script src="kartlar/eglenceli.js?v=1"></script>
<script src="kartlar/beni-ne-kadar-taniyorsun.js?v=1"></script>
<script src="kartlar/uzak-mesafe.js?v=1"></script>
<script src="kartlar/evde-gece.js?v=1"></script>
<script src="kartlar/yeni-tanisanlar.js?v=1"></script>
<script src="kartlar/gelecek.js?v=1"></script>
<script src="kartlar/ok-mu-nok-mu.js?v=1"></script>
<script src="kartlar/ikisinden-birini-sec.js?v=1"></script>
<script>
var MAX_OYUNCU=8;
var PCINS_ETIKET={hepsi:"Her ikisi",kadin:"Kadın",erkek:"Erkek"};
var sonId=0;
function yeniId(){ sonId++; return sonId; }
function yeniOyuncu(){ return {id:yeniId(),ad:"",cins:"",pcins:"hepsi",partner:"rastgele"}; }
var OYUNCULAR=[yeniOyuncu(),yeniOyuncu()];
var PARTNER_SECLER=[];
var MOD_TURLER={};
var mod="", deste=[], sira=0, oyuncuIdx=0, sonKart="", ilk=true;

/* ---------- Yardımcılar ---------- */
function modBul(ad){
  return MODLAR.filter(function(x){ return x.ad===ad; })[0];
}

function modGorevleri(modAd){
  return GOREVLER[modAd] || [];
}

function mevcutTurler(modAd){
  var g=modGorevleri(modAd);
  return TUR_LISTESI.filter(function(t){
    return g.some(function(x){ return x[0]===t.k; });
  });
}

function modTurleriYukle(){
  var kayit={};
  try{
    var k=localStorage.getItem('kartOyunModTurler');
    if(k){ kayit=JSON.parse(k)||{}; }
  }catch(e){ kayit={}; }
  MODLAR.forEach(function(m){
    MOD_TURLER[m.ad]={};
    var o=(kayit[m.ad] && typeof kayit[m.ad]==='object') ? kayit[m.ad] : {};
    var acik=0;
    var mt=mevcutTurler(m.ad);
    mt.forEach(function(t){
      var v=(typeof o[t.k]==='boolean') ? o[t.k] : true;
      MOD_TURLER[m.ad][t.k]=v;
      if(v){ acik++; }
    });
    if(acik===0){ mt.forEach(function(t){ MOD_TURLER[m.ad][t.k]=true; }); }
  });
}

function modTurleriKaydet(){
  try{ localStorage.setItem('kartOyunModTurler',JSON.stringify(MOD_TURLER)); }catch(e){}
}

function gorevSayisi(modAd){
  return modGorevleri(modAd).filter(function(g){ return MOD_TURLER[modAd][g[0]]; }).length;
}

/* ---------- Oyuncu kayıt ---------- */
function oyunculariYukle(){
  try{
    var k=localStorage.getItem('kartOyunOyuncular');
    if(!k){ return; }
    var a=JSON.parse(k);
    if(!Array.isArray(a) || a.length<2 || a.length>MAX_OYUNCU){ return; }
    var temiz=[], idler={}, idGecerli=true;
    for(var i=0;i<a.length;i++){
      if(a[i] && typeof a[i].ad==='string' && typeof a[i].cins==='string'){
        var id=a[i].id;
        if(typeof id!=='number' || idler[id]){ idGecerli=false; }
        idler[id]=true;
        var pc=(a[i].pcins==="kadin" || a[i].pcins==="erkek") ? a[i].pcins : "hepsi";
        temiz.push({id:id,ad:a[i].ad.slice(0,16),cins:a[i].cins,pcins:pc,partner:a[i].partner});
      }
    }
    if(temiz.length<2){ return; }
    if(!idGecerli){
      temiz.forEach(function(o){ o.id=yeniId(); o.partner="rastgele"; });
    }else{
      temiz.forEach(function(o){ if(o.id>sonId){ sonId=o.id; } });
    }
    OYUNCULAR=temiz;
    partnerleriDuzelt();
  }catch(e){}
}
function oyunculariKaydet(){
  try{ localStorage.setItem('kartOyunOyuncular',JSON.stringify(OYUNCULAR)); }catch(e){}
}

/* ---------- Ekran geçişi ---------- */
function goster(id){
  document.querySelectorAll('.ekran').forEach(function(e){e.classList.remove('aktif');});
  document.getElementById(id).classList.add('aktif');
}

/* ---------- Partner mantığı ---------- */
function adaylar(idx){
  var n=OYUNCULAR.length, liste=[];
  var pc=OYUNCULAR[idx].pcins;
  for(var j=0;j<n;j++){
    if(j===idx){ continue; }
    if(n===2 || pc==="hepsi" || OYUNCULAR[j].cins===pc){ liste.push(j); }
  }
  return liste;
}

function partnerleriDuzelt(){
  for(var i=0;i<OYUNCULAR.length;i++){
    var o=OYUNCULAR[i];
    if(typeof o.partner==='number'){
      var ad=adaylar(i), bulundu=false;
      for(var k=0;k<ad.length;k++){
        if(OYUNCULAR[ad[k]].id===o.partner){ bulundu=true; }
      }
      if(!bulundu){ o.partner="rastgele"; }
    }else{
      o.partner="rastgele";
    }
  }
}

/* ---------- Oyuncular ekranı ---------- */
function gorunenAd(i){
  var ad=OYUNCULAR[i].ad.trim();
  return ad!=="" ? ad : (i+1)+". oyuncu";
}

function partnerSecenekleriDoldur(sec,i){
  sec.innerHTML='';
  var ad=adaylar(i);
  ad.forEach(function(j){
    var op=document.createElement('option');
    op.value=String(OYUNCULAR[j].id);
    op.textContent=gorunenAd(j);
    sec.appendChild(op);
  });
  var rast=document.createElement('option');
  rast.value="rastgele";
  var pc=OYUNCULAR[i].pcins;
  rast.textContent=(pc==="hepsi") ? "🎲 Rastgele" : "🎲 Rastgele ("+PCINS_ETIKET[pc]+")";
  sec.appendChild(rast);
  sec.value=String(OYUNCULAR[i].partner);
}

function partnerleriYenile(){
  for(var i=0;i<OYUNCULAR.length;i++){
    if(PARTNER_SECLER[i]){ partnerSecenekleriDoldur(PARTNER_SECLER[i],i); }
  }
}

function oyunculariCiz(){
  var kap=document.getElementById('oyuncuListe');
  kap.innerHTML='';
  PARTNER_SECLER=[];
  OYUNCULAR.forEach(function(o,i){
    var kutu=document.createElement('div');
    kutu.className='oyuncu';

    var ust=document.createElement('div');
    ust.className='satir';
    var inp=document.createElement('input');
    inp.type='text';
    inp.maxLength=16;
    inp.placeholder=(i+1)+'. oyuncunun adı';
    inp.value=o.ad;
    inp.setAttribute('autocomplete','off');
    inp.oninput=function(){ OYUNCULAR[i].ad=inp.value; partnerleriYenile(); };
    ust.appendChild(inp);
    if(OYUNCULAR.length>2){
      var sil=document.createElement('button');
      sil.className='sil';
      sil.textContent='✕';
      sil.onclick=function(){ oyuncuSil(i); };
      ust.appendChild(sil);
    }
    kutu.appendChild(ust);

    var sec=document.createElement('select');
    var secenekler=[["","Cinsiyet seç"],["kadin","Kadın"],["erkek","Erkek"],["belirtmem","Belirtmek istemiyorum"]];
    secenekler.forEach(function(s){
      var op=document.createElement('option');
      op.value=s[0];
      op.textContent=s[1];
      if(o.cins===s[0]){ op.selected=true; }
      sec.appendChild(op);
    });
    sec.onchange=function(){
      OYUNCULAR[i].cins=sec.value;
      partnerleriDuzelt();
      partnerleriYenile();
    };
    kutu.appendChild(sec);

    if(OYUNCULAR.length>2){
      var et1=document.createElement('div');
      et1.className='etiket';
      et1.textContent='Partner cinsiyeti';
      kutu.appendChild(et1);
      var pcSec=document.createElement('select');
      ["hepsi","kadin","erkek"].forEach(function(v){
        var op=document.createElement('option');
        op.value=v;
        op.textContent=PCINS_ETIKET[v];
        if(o.pcins===v){ op.selected=true; }
        pcSec.appendChild(op);
      });
      pcSec.onchange=function(){
        OYUNCULAR[i].pcins=pcSec.value;
        partnerleriDuzelt();
        partnerleriYenile();
      };
      kutu.appendChild(pcSec);

      var et2=document.createElement('div');
      et2.className='etiket';
      et2.textContent='Partneri';
      kutu.appendChild(et2);
      var ps=document.createElement('select');
      partnerSecenekleriDoldur(ps,i);
      ps.onchange=function(){
        OYUNCULAR[i].partner=(ps.value==="rastgele") ? "rastgele" : Number(ps.value);
      };
      kutu.appendChild(ps);
      PARTNER_SECLER[i]=ps;
    }

    kap.appendChild(kutu);
  });
  document.getElementById('ekleBtn').style.display=(OYUNCULAR.length>=MAX_OYUNCU)?'none':'block';
}

function oyuncuEkle(){
  if(OYUNCULAR.length>=MAX_OYUNCU){ return; }
  OYUNCULAR.push(yeniOyuncu());
  document.getElementById('oyuncuUyari').textContent="";
  oyunculariCiz();
}

function oyuncuSil(i){
  if(OYUNCULAR.length<=2){ return; }
  OYUNCULAR.splice(i,1);
  partnerleriDuzelt();
  document.getElementById('oyuncuUyari').textContent="";
  oyunculariCiz();
}

function oyuncularKontrol(){
  var gorulen={};
  var n=OYUNCULAR.length;
  for(var i=0;i<n;i++){
    var ad=OYUNCULAR[i].ad.trim();
    if(ad===""){ return (i+1)+". oyuncunun adını yaz."; }
    if(OYUNCULAR[i].cins===""){ return ad+" için cinsiyet seç."; }
    var anahtar=ad.toLocaleLowerCase('tr');
    if(gorulen[anahtar]){ return "Aynı isim iki kez kullanılmış: "+ad+". İsimleri ayırt edilebilir yap."; }
    gorulen[anahtar]=true;
  }
  if(n>2){
    for(var j=0;j<n;j++){
      if(adaylar(j).length===0){
        return OYUNCULAR[j].ad.trim()+" için seçtiğin partner cinsiyetinde ("+PCINS_ETIKET[OYUNCULAR[j].pcins]+") başka oyuncu yok. Partner cinsiyetini değiştir.";
      }
    }
  }
  return "";
}

function oyuncularDevam(){
  var hata=oyuncularKontrol();
  document.getElementById('oyuncuUyari').textContent=hata;
  if(hata!==""){ return; }
  for(var i=0;i<OYUNCULAR.length;i++){ OYUNCULAR[i].ad=OYUNCULAR[i].ad.trim(); }
  oyunculariKaydet();
  goster('modlar');
}

/* ---------- Mod ekranı ---------- */
function modlariCiz(){
  var kap=document.getElementById('modListe');
  kap.innerHTML='';
  MODLAR.forEach(function(m){
    if(modGorevleri(m.ad).length===0){ return; }
    var b=document.createElement('button');
    b.className='mod';
    var ik=document.createElement('span');
    ik.className='mik';
    ik.textContent=m.ikon;
    var metin=document.createElement('span');
    var baslik=document.createElement('span');
    baslik.textContent=m.ad;
    var alt=document.createElement('small');
    alt.textContent=m.aciklama;
    metin.appendChild(baslik);
    metin.appendChild(alt);
    b.appendChild(ik);
    b.appendChild(metin);
    b.onclick=function(){ turSayfasiAc(m.ad); };
    kap.appendChild(b);
  });
}

/* ---------- Tür seçim ekranı ---------- */
function turSayfasiAc(ad){
  mod=ad;
  var m=modBul(ad);
  document.getElementById('turBaslik').textContent=m.ikon+" "+m.ad;
  document.getElementById('turAciklama').textContent="Bu mod için hangi görev türleri gelsin?";
  document.getElementById('uyari').textContent="";
  var kap=document.getElementById('turGrid');
  kap.innerHTML='';
  mevcutTurler(ad).forEach(function(t){
    var b=document.createElement('button');
    b.id='tur_'+t.k;
    b.className='tur';
    var ik=document.createElement('span');
    ik.className='ik';
    ik.textContent=t.e;
    b.appendChild(ik);
    b.appendChild(document.createTextNode(t.ad));
    b.onclick=function(){ turDegis(t.k); };
    kap.appendChild(b);
  });
  turGuncelle();
  goster('turEkran');
}

function turGuncelle(){
  var hepsiAcik=true;
  mevcutTurler(mod).forEach(function(t){
    var acik=MOD_TURLER[mod][t.k];
    document.getElementById('tur_'+t.k).classList.toggle('acik',acik);
    if(!acik){ hepsiAcik=false; }
  });
  document.getElementById('hepsiBtn').style.display=hepsiAcik?'none':'block';
  document.getElementById('baslaBtn').textContent="🎴 Başla ("+gorevSayisi(mod)+" görev)";
}

function turDegis(k){
  var acikSayi=0;
  mevcutTurler(mod).forEach(function(t){ if(MOD_TURLER[mod][t.k]){ acikSayi++; } });
  if(MOD_TURLER[mod][k] && acikSayi===1){
    document.getElementById('uyari').textContent="En az bir tür açık kalmalı.";
    return;
  }
  MOD_TURLER[mod][k]=!MOD_TURLER[mod][k];
  document.getElementById('uyari').textContent="";
  modTurleriKaydet();
  turGuncelle();
}

function hepsiniAc(){
  mevcutTurler(mod).forEach(function(t){ MOD_TURLER[mod][t.k]=true; });
  document.getElementById('uyari').textContent="";
  modTurleriKaydet();
  turGuncelle();
}

/* ---------- Deste ve oyun ---------- */
function karistir(d){
  for(var i=d.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=d[i];d[i]=d[j];d[j]=t;
  }
  return d;
}

function yeniDeste(){
  var liste=modGorevleri(mod).filter(function(g){return MOD_TURLER[mod][g[0]];}).map(function(g){return g[1];});
  deste=karistir(liste);
  if(deste.length>1 && deste[0]===sonKart){
    var t=deste[0];deste[0]=deste[1];deste[1]=t;
  }
  sira=0;
}

function oyunuBaslat(){
  oyuncuIdx=0; sonKart=""; ilk=true;
  yeniDeste();
  if(deste.length===0){
    document.getElementById('uyari').textContent="Seçili türlerde görev yok. Bir tür aç.";
    return;
  }
  var m=modBul(mod);
  document.getElementById('modAdi').textContent=m.ikon+" "+m.ad;
  document.getElementById('kart').textContent="Hazır olunca kart çek 👇";
  document.getElementById('siraBilgi').textContent="";
  document.getElementById('sayac').textContent="";
  var kural=document.getElementById('kuralBilgi');
  if(m.kural){
    kural.textContent=m.kural;
    kural.style.display="block";
  }else{
    kural.textContent="";
    kural.style.display="none";
  }
  document.getElementById('cekBtn').textContent="🎴 Kart Çek";
  document.getElementById('pasBtn').style.display="none";
  goster('oyun');
}

function partnerBul(idx){
  var o=OYUNCULAR[idx];
  var ad=adaylar(idx);
  if(typeof o.partner==='number'){
    for(var k=0;k<ad.length;k++){
      if(OYUNCULAR[ad[k]].id===o.partner){ return ad[k]; }
    }
  }
  if(ad.length===0){
    for(var j=0;j<OYUNCULAR.length;j++){
      if(j!==idx){ ad.push(j); }
    }
  }
  return ad[Math.floor(Math.random()*ad.length)];
}

function kartCek(pas){
  var n=OYUNCULAR.length;
  var m=modBul(mod);
  if(!pas && !ilk){ oyuncuIdx=(oyuncuIdx+1)%n; }
  ilk=false;
  if(sira>=deste.length){ yeniDeste(); }
  var gorev=deste[sira];
  sira++;
  sonKart=gorev;
  var kart=document.getElementById('kart');
  kart.classList.remove('cevir');
  void kart.offsetWidth;
  kart.textContent=gorev;
  kart.classList.add('cevir');
  if(m.kural){
    document.getElementById('siraBilgi').textContent="Kartı okuyan: "+OYUNCULAR[oyuncuIdx].ad;
  }else{
    var partnerIdx=partnerBul(oyuncuIdx);
    document.getElementById('siraBilgi').textContent="Sıra: "+OYUNCULAR[oyuncuIdx].ad+"  |  Partner: "+OYUNCULAR[partnerIdx].ad;
  }
  document.getElementById('sayac').textContent="Kart "+sira+" / "+deste.length;
  document.getElementById('cekBtn').textContent=m.buton ? m.buton : "✅ Yaptık, Sonraki Kart";
  document.getElementById('pasBtn').style.display="block";
}
