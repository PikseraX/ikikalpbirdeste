<body>

<div id="menu" class="ekran aktif">
<div class="logoK" aria-hidden="true">💜</div>
<h1 class="logoY"><span id="oyunBaslik"><span id="oyunAdiSatir1">İki Kalp</span><br><span id="oyunAdiSatir2">Bir Deste</span></span></h1>
<p>Kart çek, görevi yap, birlikte eğlen.</p>
<button onclick="goster('oyuncular')">Oyuna Başla</button>
<button class="ikincil" onclick="gbAc()">💬 Geri bildirim</button>
<button id="gizlilikPolitikasi" class="ikincil kucuk" onclick="location.href='gizlilik.html'" hidden>Gizlilik politikası / Privacy Policy</button>
</div>

<div id="oyuncular" class="ekran">
<h2>Kimler oynuyor?</h2>
<div id="oyuncuListe"></div>
<button id="ekleBtn" class="ikincil" onclick="oyuncuEkle()">＋ Yeni oyuncu ekle</button>
<p id="oyuncuUyari" class="bilgi uyari"></p>
<button onclick="oyuncularDevam()">Devam Et</button>
<button class="ikincil" onclick="goster('menu')">← Geri</button>
</div>

<div id="modlar" class="ekran">
<h2>Bir mod seç</h2>
<div id="modListe"></div>
<button class="ikincil" onclick="goster('oyuncular')">← Oyunculara dön</button>
</div>

<div id="turEkran" class="ekran">
<h2 id="turBaslik"></h2>
<p id="turAciklama" class="bilgi"></p>
<div id="turGrid" class="turler"></div>
<p class="bilgi">İstemediğin türü kapat. Her kartta Pas Geç de var.</p>
<button id="hepsiBtn" class="ikincil kucuk" style="display:none" onclick="hepsiniAc()">Hepsini aç</button>
<p id="uyari" class="bilgi uyari"></p>
<button id="baslaBtn" onclick="oyunuBaslat()">🎴 Başla</button>
<button class="ikincil" onclick="goster('modlar')">← Mod seçimine dön</button>
</div>

<div id="oyun" class="ekran">
<h2 id="modAdi"></h2>
<div class="bilgi" id="siraBilgi"></div>
<div class="kart" id="kart">Hazır olunca kart çek 👇</div>
<div class="bilgi" id="kuralBilgi" style="display:none"></div>
<div class="bilgi" id="sayac"></div>
<button id="cekBtn" onclick="kartCek(false)">🎴 Kart Çek</button>
<button id="pasBtn" class="ikincil" style="display:none" onclick="kartCek(true)">⏭️ Pas Geç</button>
<button class="ikincil" onclick="turSayfasiAc(mod)">← Türleri değiştir</button>
<button class="ikincil" onclick="goster('modlar')">Mod değiştir</button>
</div>

<div id="geriEkran" class="ekran">
<h2>💬 Geri bildirim</h2>
<p class="bilgi">Önerini ya da bulduğun hatayı yaz. E-posta uygulaman hazır bir mesajla açılır, sen gönderirsin.</p>
<div class="oyuncu">
<select id="gTur">
<option>💡 Öneri</option>
<option>🐞 Hata</option>
<option>🃏 Kart önerisi</option>
<option>❤️ Beğendim</option>
</select>
<textarea id="gMetin" maxlength="500" rows="5" placeholder="Mesajını yaz…"></textarea>
</div>
<p id="gUyari" class="bilgi uyari"></p>
<button onclick="gGonder()">📨 Gönder</button>
<button class="ikincil" onclick="goster('menu')">← Geri</button>
</div>
